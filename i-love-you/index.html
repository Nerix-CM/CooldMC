<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Прости меня ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to top, #ff99aa, #ffe0e6);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 16px;
            margin: 0;
            touch-action: pan-y;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 460px;
        }

        .window {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 100px;
            padding: 32px 28px 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(255, 80, 120, 0.25);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .window.splash {
            animation: splashDown 0.8s cubic-bezier(0.34, 1.0, 0.64, 1) forwards;
        }

        @keyframes splashDown {
            0% {
                transform: scale(1) translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 100px;
            }
            25% {
                transform: scale(1.04) translateY(8px) rotate(1deg);
                opacity: 0.9;
                border-radius: 80px;
            }
            50% {
                transform: scale(0.95) translateY(30px) rotate(2deg);
                opacity: 0.6;
                border-radius: 50px;
            }
            75% {
                transform: scale(0.85) translateY(70px) rotate(3deg);
                opacity: 0.3;
                border-radius: 30px;
            }
            100% {
                transform: scale(0.7) translateY(140px) rotate(4deg);
                opacity: 0;
                border-radius: 10px;
            }
        }

        .water-drop {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: dropFall 0.8s cubic-bezier(0.34, 1.0, 0.64, 1) forwards;
        }

        @keyframes dropFall {
            0% {
                transform: scale(0) translateY(0);
                opacity: 0.8;
            }
            30% {
                transform: scale(1) translateY(10px);
                opacity: 0.9;
            }
            100% {
                transform: scale(0.3) translateY(120px);
                opacity: 0;
            }
        }

        .hint-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: #b34b5e;
            margin-bottom: 24px;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 4px rgba(255, 200, 200, 0.3);
            transition: opacity 0.3s;
        }

        .hint-text.fade {
            opacity: 0;
        }

        .slider-track {
            width: 100%;
            height: 56px;
            background: rgba(255, 220, 225, 0.6);
            border-radius: 60px;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(180, 70, 90, 0.15);
            touch-action: none;
            cursor: grab;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.2s;
        }

        .slider-track:active {
            cursor: grabbing;
        }

        .slider-thumb {
            position: absolute;
            left: 4px;
            top: 4px;
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #ff7b8a, #f24b6a);
            border-radius: 50%;
            box-shadow: 0 6px 14px rgba(220, 50, 80, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.2s;
            touch-action: none;
            will-change: transform;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .slider-thumb::after {
            content: "▶";
            font-size: 1.6rem;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            margin-left: 4px;
        }

        .slider-thumb:active {
            box-shadow: 0 8px 20px rgba(200, 40, 70, 0.7);
        }

        .slider-fill {
            height: 100%;
            border-radius: 60px;
            background: linear-gradient(90deg, #ff8a9c, #ff4d6d);
            width: 0%;
            transition: width 0.05s linear;
            pointer-events: none;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.3;
        }

        .final-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 380px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            padding: 16px;
        }

        .final-content.pop-up {
            animation: popUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 0.5s;
            opacity: 0;
        }

        @keyframes popUp {
            0% {
                transform: translate(-50%, -50%) scale(0.5) translateY(40px);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05) translateY(-8px);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) translateY(0);
                opacity: 1;
            }
        }

        .final-content h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #a1324b;
            text-shadow: 0 4px 12px rgba(255, 120, 140, 0.4);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .final-content p {
            font-size: 1.6rem;
            font-weight: 500;
            color: #b34b5e;
            margin-bottom: 28px;
            text-shadow: 0 2px 8px rgba(255, 150, 170, 0.3);
        }

        .forgive-btn {
            display: inline-block;
            background: linear-gradient(145deg, #ff6b7f, #e8435a);
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 16px 48px;
            border-radius: 60px;
            text-decoration: none;
            box-shadow: 0 12px 28px rgba(220, 50, 80, 0.4);
            transition: all 0.2s ease;
            border: 2px solid rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            backdrop-filter: blur(2px);
            background-color: #ff4d6d;
            cursor: pointer;
            position: relative;
            z-index: 30;
        }

        .forgive-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 16px 36px rgba(220, 50, 80, 0.5);
        }

        .forgive-btn:active {
            transform: scale(0.94);
            box-shadow: 0 6px 16px rgba(200, 30, 60, 0.5);
        }

        .window.hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .window {
                padding: 28px 20px 34px;
                border-radius: 80px;
            }
            .slider-thumb {
                width: 44px;
                height: 44px;
            }
            .slider-track {
                height: 52px;
            }
            .final-content h2 {
                font-size: 1.8rem;
            }
            .final-content p {
                font-size: 1.4rem;
            }
            .forgive-btn {
                font-size: 1.2rem;
                padding: 14px 36px;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <div class="window" id="sliderWindow">
        <div class="hint-text" id="hintText">Потяни вправо</div>
        <div class="slider-track" id="sliderTrack">
            <div class="slider-fill" id="sliderFill"></div>
            <div class="slider-thumb" id="sliderThumb"></div>
        </div>
    </div>

    <div class="final-content" id="finalContent">
        <h2>Я тебя люблю❤️</h2>
        <p>Прости меня пожалуйста</p>
        <a href="https://t.me/nerix_cm?text=Прощаю❤️" class="forgive-btn" id="forgiveBtn" target="_blank">Простить</a>
    </div>
</div>

<script>
    (function() {
        const container = document.getElementById('appContainer');
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderThumb = document.getElementById('sliderThumb');
        const sliderFill = document.getElementById('sliderFill');
        const hintText = document.getElementById('hintText');
        const windowEl = document.getElementById('sliderWindow');
        const finalContent = document.getElementById('finalContent');
        const forgiveBtn = document.getElementById('forgiveBtn');

        let isDragging = false;
        let isCompleted = false;

        // Дублируем обработчик клика на кнопку (на случай, если ссылка не сработает)
        forgiveBtn.addEventListener('click', function(e) {
            // Если ссылка по каким-то причинам не открывается, дублируем переход
            if (!e.defaultPrevented) {
                window.open('https://t.me/nerix_cm?text=Прощаю❤️', '_blank');
            }
        });

        // Создание капель воды
        function createWaterDrops() {
            const rect = windowEl.getBoundingClientRect();
            const dropCount = 20;
            
            for (let i = 0; i < dropCount; i++) {
                const drop = document.createElement('div');
                drop.className = 'water-drop';
                const size = 6 + Math.random() * 16;
                const xPos = rect.left + rect.width * (0.05 + Math.random() * 0.9);
                const yPos = rect.top + rect.height * (0.05 + Math.random() * 0.9);
                
                drop.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${xPos}px;
                    top: ${yPos}px;
                    animation-delay: ${Math.random() * 0.4}s;
                    background: rgba(255, 255, 255, ${0.25 + Math.random() * 0.55});
                `;
                document.body.appendChild(drop);
                
                setTimeout(() => {
                    if (drop.parentNode) {
                        drop.remove();
                    }
                }, 1400);
            }
        }

        function completeSlider() {
            if (isCompleted) return;
            isCompleted = true;

            // Добавляем класс для анимации смывания
            windowEl.classList.add('splash');
            
            // Создаем капли воды
            createWaterDrops();
            
            // Прячем подсказку
            hintText.classList.add('fade');
            
            // После завершения анимации (0.8 сек) показываем финальный контент
            setTimeout(() => {
                windowEl.classList.add('hidden');
                finalContent.classList.add('pop-up');
                container.style.minHeight = '460px';
                
                // Убеждаемся, что кнопка кликабельна
                forgiveBtn.style.pointerEvents = 'auto';
            }, 850);
        }

        function getClientX(e) {
            if (e.touches) {
                return e.touches[0].clientX;
            }
            return e.clientX;
        }

        function onPointerDown(e) {
            if (isCompleted) return;
            e.preventDefault();
            isDragging = true;
            sliderThumb.style.cursor = 'grabbing';
            document.body.style.touchAction = 'none';
        }

        function onPointerMove(e) {
            if (!isDragging || isCompleted) return;
            e.preventDefault();

            const trackRect = sliderTrack.getBoundingClientRect();
            const trackWidth = trackRect.width;
            const thumbWidth = sliderThumb.offsetWidth;
            const offset = thumbWidth / 2;

            let clientX = getClientX(e);
            let relativeX = clientX - trackRect.left - offset;
            let maxLeft = trackWidth - thumbWidth;
            let newLeft = Math.min(maxLeft, Math.max(0, relativeX));

            let percent = (newLeft / maxLeft) * 100;
            if (percent > 100) percent = 100;
            if (percent < 0) percent = 0;

            sliderThumb.style.left = newLeft + 'px';
            sliderFill.style.width = percent + '%';

            if (percent >= 96) {
                isDragging = false;
                sliderThumb.style.left = (maxLeft) + 'px';
                sliderFill.style.width = '100%';
                completeSlider();
                document.body.style.touchAction = '';
                sliderThumb.style.cursor = 'grab';
                return;
            }
        }

        function onPointerUp(e) {
            if (isDragging) {
                isDragging = false;
                document.body.style.touchAction = '';
                sliderThumb.style.cursor = 'grab';

                const currentLeft = parseFloat(sliderThumb.style.left) || 0;
                const trackRect = sliderTrack.getBoundingClientRect();
                const trackWidth = trackRect.width;
                const thumbWidth = sliderThumb.offsetWidth;
                const maxLeft = trackWidth - thumbWidth;

                if (currentLeft < maxLeft * 0.88) {
                    sliderThumb.style.transition = 'left 0.25s ease, width 0.25s ease';
                    sliderThumb.style.left = '4px';
                    sliderFill.style.transition = 'width 0.25s ease';
                    sliderFill.style.width = '0%';
                    setTimeout(() => {
                        sliderThumb.style.transition = '';
                        sliderFill.style.transition = '';
                    }, 300);
                } else {
                    const percent = (currentLeft / maxLeft) * 100;
                    if (percent >= 88) {
                        sliderThumb.style.transition = 'left 0.2s ease';
                        sliderThumb.style.left = maxLeft + 'px';
                        sliderFill.style.transition = 'width 0.2s ease';
                        sliderFill.style.width = '100%';
                        setTimeout(() => {
                            sliderThumb.style.transition = '';
                            sliderFill.style.transition = '';
                            completeSlider();
                        }, 220);
                    }
                }
            }
        }

        // События
        sliderThumb.addEventListener('mousedown', onPointerDown);
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('mouseup', onPointerUp);

        sliderThumb.addEventListener('touchstart', onPointerDown, { passive: false });
        document.addEventListener('touchmove', onPointerMove, { passive: false });
        document.addEventListener('touchend', onPointerUp, { passive: false });
        document.addEventListener('touchcancel', onPointerUp, { passive: false });

        sliderTrack.addEventListener('click', function(e) {
            if (isCompleted) return;
            if (e.target === sliderThumb) return;

            const trackRect = sliderTrack.getBoundingClientRect();
            const thumbWidth = sliderThumb.offsetWidth;
            const maxLeft = trackRect.width - thumbWidth;
            let clientX = e.clientX;
            let relativeX = clientX - trackRect.left - thumbWidth/2;
            let newLeft = Math.min(maxLeft, Math.max(0, relativeX));
            let percent = (newLeft / maxLeft) * 100;

            if (percent >= 96) {
                sliderThumb.style.transition = 'left 0.2s ease';
                sliderThumb.style.left = maxLeft + 'px';
                sliderFill.style.transition = 'width 0.2s ease';
                sliderFill.style.width = '100%';
                setTimeout(() => {
                    sliderThumb.style.transition = '';
                    sliderFill.style.transition = '';
                    completeSlider();
                }, 220);
            } else {
                sliderThumb.style.transition = 'left 0.25s ease';
                sliderThumb.style.left = newLeft + 'px';
                sliderFill.style.transition = 'width 0.25s ease';
                sliderFill.style.width = percent + '%';
                setTimeout(() => {
                    sliderThumb.style.transition = '';
                    sliderFill.style.transition = '';
                }, 300);
            }
        });

        window.addEventListener('touchmove', function(e) {
            if (isDragging) {
                e.preventDefault();
            }
        }, { passive: false });

        sliderThumb.style.left = '4px';
        sliderFill.style.width = '0%';
    })();
</script>
</body>
</html>
